        function roundNumber(value, digits) {
            return Number(value.toFixed(digits));
        }

        function endpointKey(coord) {
            return roundNumber(coord[0], 6) + ',' + roundNumber(coord[1], 6);
        }

        function getSavedCameraOverrides() {
            try {
                return JSON.parse(window.localStorage.getItem(CAMERA_OVERRIDE_STORAGE_KEY) || '{}');
            } catch (err) {
                return {};
            }
        }

        function applySavedCameraOverrides() {
            var overrides = getSavedCameraOverrides();
            config.chapters.forEach(function (chapter) {
                var override = overrides[chapter.id];
                if (!override) return;
                chapter.location = override.location;
                chapter.fitToStreetBounds = false;
            });
        }

        applySavedCameraOverrides();

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function smoothstep(edge0, edge1, value) {
            var t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
            return t * t * (3 - 2 * t);
        }

        function hexToRgb(hex) {
            var normalized = hex.replace('#', '');
            return {
                r: parseInt(normalized.slice(0, 2), 16),
                g: parseInt(normalized.slice(2, 4), 16),
                b: parseInt(normalized.slice(4, 6), 16)
            };
        }

        function mixColors(startHex, endHex, amount) {
            var start = hexToRgb(startHex);
            var end = hexToRgb(endHex);
            var t = clamp(amount, 0, 1);
            return 'rgb(' + Math.round(start.r + (end.r - start.r) * t) + ', ' +
                Math.round(start.g + (end.g - start.g) * t) + ', ' +
                Math.round(start.b + (end.b - start.b) * t) + ')';
        }

        function isStreetHighlightLayer(layerId) {
            return Boolean(streetHighlightColors[layerId]);
        }

        function getStreetHighlightLayers(chapterItems) {
            return chapterItems
                .map(function (item) { return item.layer; })
                .filter(isStreetHighlightLayer);
        }

        function getStreetHighlightItems(chapterItems) {
            return chapterItems.filter(function (item) {
                return isStreetHighlightLayer(item.layer);
            });
        }

        function getNonStreetHighlightItems(chapterItems) {
            return chapterItems.filter(function (item) {
                return !isStreetHighlightLayer(item.layer);
            });
        }

        function setStreetHighlightProgress(layerId, progress) {
            if (!map.getLayer(layerId)) return;

            var t = clamp(progress, 0, 1);
            var glowLayerId = streetGlowLayerIds[layerId];
            var targetColor = streetHighlightColors[layerId];
            var glowOpacity = 0.22 * smoothstep(0.02, 0.22, t);
            var coreOpacity = 0.82 * smoothstep(0.08, 0.38, t);
            var colorMix = smoothstep(0.2, 0.88, t);
            var widthMix = smoothstep(0.32, 1, t);
            var glowWidthMix = smoothstep(0.06, 0.44, t);

            if (glowLayerId && map.getLayer(glowLayerId)) {
                map.setPaintProperty(glowLayerId, 'line-color', targetColor);
                map.setPaintProperty(glowLayerId, 'line-opacity', glowOpacity);
                map.setPaintProperty(glowLayerId, 'line-width', 7 + 3 * glowWidthMix);
            }

            map.setPaintProperty(layerId, 'line-color', mixColors('#ffffff', targetColor, colorMix));
            map.setPaintProperty(layerId, 'line-opacity', coreOpacity);
            map.setPaintProperty(layerId, 'line-width', 3.4 + 1.6 * widthMix);
        }

        function setStreetHighlightFadeFactor(layerId, factor) {
            if (!map.getLayer(layerId)) return;

            var t = clamp(factor, 0, 1);
            var glowLayerId = streetGlowLayerIds[layerId];

            map.setPaintProperty(layerId, 'line-opacity-transition', { duration: 180 });
            map.setPaintProperty(layerId, 'line-opacity', 1 * t);

            if (glowLayerId && map.getLayer(glowLayerId)) {
                map.setPaintProperty(glowLayerId, 'line-opacity-transition', { duration: 180 });
                map.setPaintProperty(glowLayerId, 'line-opacity', 0.04 * t);
            }
        }

        function updateStreetHighlightFadeForChapter(chapter, progress) {
            if (activeStreetHighlightChapterId !== chapter.id) return;

            if (Date.now() - activeStreetHighlightStartedAt < 1400) {
                return;
            }

            var fadeFactor = 1 - smoothstep(0.84, 0.985, progress);
            getStreetHighlightLayers(chapter.onChapterEnter || []).forEach(function (layerId) {
                setStreetHighlightFadeFactor(layerId, fadeFactor);
            });
        }

        function applyChapterLayerState(chapterItems, entering) {
            chapterItems.forEach(function (item) {
                setLayerOpacity(item);
            });
        }

        function primeStreetHighlightItems(chapterItems) {
            chapterItems.forEach(function (item) {
                var layerId = item.layer;
                var glowLayerId = streetGlowLayerIds[layerId];
                if (!map.getLayer(layerId)) return;

                map.setPaintProperty(layerId, 'line-color-transition', { duration: 0 });
                map.setPaintProperty(layerId, 'line-opacity-transition', { duration: 0 });
                map.setPaintProperty(layerId, 'line-width-transition', { duration: 0 });
                map.setPaintProperty(layerId, 'line-color', '#ffffff');
                map.setPaintProperty(layerId, 'line-opacity', 0);
                map.setPaintProperty(layerId, 'line-width', 3.4);

                if (glowLayerId && map.getLayer(glowLayerId)) {
                    map.setPaintProperty(glowLayerId, 'line-color-transition', { duration: 0 });
                    map.setPaintProperty(glowLayerId, 'line-opacity-transition', { duration: 0 });
                    map.setPaintProperty(glowLayerId, 'line-width-transition', { duration: 0 });
                    map.setPaintProperty(glowLayerId, 'line-color', item.color || streetHighlightColors[layerId]);
                    map.setPaintProperty(glowLayerId, 'line-opacity', 0);
                    map.setPaintProperty(glowLayerId, 'line-width', 7);
                }
            });
        }

        function clearPendingStreetHighlight() {
            if (pendingStreetHighlightTimer) {
                window.clearTimeout(pendingStreetHighlightTimer);
                pendingStreetHighlightTimer = null;
            }
            if (pendingStreetApplyFrame) {
                window.cancelAnimationFrame(pendingStreetApplyFrame);
                pendingStreetApplyFrame = null;
            }
        }

        function areStreetHighlightLayersReady(chapter) {
            return getStreetHighlightLayers(chapter.onChapterEnter || []).every(function (layerId) {
                return !!map.getLayer(layerId);
            });
        }

        function activatePendingStreetHighlight(chapterId) {
            if (pendingStreetHighlightChapterId !== chapterId) return;

            var chapter = config.chapters.find(function (chap) {
                return chap.id === chapterId;
            });
            if (!chapter) return;

            if (!areStreetHighlightLayersReady(chapter)) {
                clearPendingStreetHighlight();
                pendingStreetHighlightTimer = window.setTimeout(function () {
                    activatePendingStreetHighlight(chapterId);
                }, 250);
                return;
            }

            if (map.isMoving && map.isMoving()) {
                map.once('moveend', function () {
                    activatePendingStreetHighlight(chapterId);
                });
                return;
            }

            var streetItems = getStreetHighlightItems(chapter.onChapterEnter || []);
            primeStreetHighlightItems(streetItems);
            pendingStreetApplyFrame = window.requestAnimationFrame(function () {
                pendingStreetApplyFrame = window.requestAnimationFrame(function () {
                    pendingStreetApplyFrame = null;
                    applyChapterLayerState(streetItems, true);
                });
            });
            activeStreetHighlightChapterId = chapterId;
            activeStreetHighlightStartedAt = Date.now();
            pendingStreetHighlightChapterId = null;
            pendingStreetHighlightTimer = null;
        }

        function scheduleStreetHighlightStart(chapter) {
            var streetItems = getStreetHighlightItems(chapter.onChapterEnter || []);
            if (!streetItems.length) return;

            pendingStreetHighlightChapterId = chapter.id;
            clearPendingStreetHighlight();
            pendingStreetHighlightTimer = window.setTimeout(function () {
                activatePendingStreetHighlight(chapter.id);
            }, 220);
        }

        function extendBoundsWithCoordinates(bounds, coordinates) {
            if (!Array.isArray(coordinates)) return bounds;

            if (typeof coordinates[0] === 'number' && typeof coordinates[1] === 'number') {
                if (!bounds) {
                    return [coordinates[0], coordinates[1], coordinates[0], coordinates[1]];
                }
                bounds[0] = Math.min(bounds[0], coordinates[0]);
                bounds[1] = Math.min(bounds[1], coordinates[1]);
                bounds[2] = Math.max(bounds[2], coordinates[0]);
                bounds[3] = Math.max(bounds[3], coordinates[1]);
                return bounds;
            }

            coordinates.forEach(function (child) {
                bounds = extendBoundsWithCoordinates(bounds, child);
            });
            return bounds;
        }

        function getLineCoordinates(feature) {
            var geometry = feature.geometry || {};
            if (geometry.type === 'LineString') return geometry.coordinates || [];
            if (geometry.type === 'MultiLineString') return (geometry.coordinates && geometry.coordinates[0]) || [];
            return [];
        }

        function getLineLengthMeters(coords) {
            var total = 0;
            for (var i = 1; i < coords.length; i += 1) {
                var a = coords[i - 1];
                var b = coords[i];
                var dx = (b[0] - a[0]) * 111320 * Math.cos(((a[1] + b[1]) / 2) * Math.PI / 180);
                var dy = (b[1] - a[1]) * 110540;
                total += Math.sqrt(dx * dx + dy * dy);
            }
            return total;
        }

        function trimLineEnd(coords, trimMeters) {
            if (!coords || coords.length < 2 || trimMeters <= 0) return coords;

            var remaining = trimMeters;
            var trimmed = coords.slice();

            while (trimmed.length > 1 && remaining > 0) {
                var last = trimmed[trimmed.length - 1];
                var prev = trimmed[trimmed.length - 2];
                var segmentLength = getLineLengthMeters([prev, last]);

                if (segmentLength <= remaining) {
                    trimmed.pop();
                    remaining -= segmentLength;
                    continue;
                }

                var ratio = (segmentLength - remaining) / segmentLength;
                trimmed[trimmed.length - 1] = [
                    prev[0] + (last[0] - prev[0]) * ratio,
                    prev[1] + (last[1] - prev[1]) * ratio
                ];
                remaining = 0;
            }

            return trimmed;
        }

        function getGenderStreetNameParts(streetName) {
            if (!streetName || excludedGenderStreetNamePattern.test(streetName)) return [];

            var cleaned = streetName
                .replace(
                    /(straße|strasse|-Str\.|allee|weg|platz|damm|chaussee|ring|gasse|steig|pfad|zeile|promenade|ufer|korso|terrasse|brücke|markt|steg|kai|bogen|tunnel|park|hain)$/i,
                    ''
                )
                .trim()
                .replace(/-$/, '');

            return cleaned.split(/[-\s/()]+/).filter(Boolean);
        }

        function classifyStreetGender(streetName) {
            var parts = getGenderStreetNameParts(streetName);
            if (!parts.length) return null;

            var hasFemale = parts.some(function (part) {
                return femaleStreetNameParts.has(part);
            });
            var hasMale = parts.some(function (part) {
                return maleStreetNameParts.has(part);
            });

            if (hasFemale === hasMale) return null;
            return hasFemale ? 'female' : 'male';
        }

        function buildGenderStreetGeojson(geojson, gender) {
            return {
                type: 'FeatureCollection',
                features: (geojson.features || []).filter(function (feature) {
                    var streetName = feature.properties && feature.properties.strname;
                    return classifyStreetGender(streetName) === gender;
                })
            };
        }

        function pruneStreetBranchFeatures(features, maxLeafLengthMeters) {
            if (features.length <= 1) return features.slice();

            var kept = features.slice();
            var changed = true;

            while (changed && kept.length > 1) {
                changed = false;
                var degrees = {};

                kept.forEach(function (feature) {
                    var coords = getLineCoordinates(feature);
                    if (coords.length < 2) return;
                    var startKey = endpointKey(coords[0]);
                    var endKey = endpointKey(coords[coords.length - 1]);
                    degrees[startKey] = (degrees[startKey] || 0) + 1;
                    degrees[endKey] = (degrees[endKey] || 0) + 1;
                });

                var next = [];
                kept.forEach(function (feature) {
                    var coords = getLineCoordinates(feature);
                    if (coords.length < 2) {
                        next.push(feature);
                        return;
                    }

                    var startKey = endpointKey(coords[0]);
                    var endKey = endpointKey(coords[coords.length - 1]);
                    var isLeaf = (degrees[startKey] === 1 || degrees[endKey] === 1);
                    var isShort = (feature.properties && feature.properties.__segment_length_m || 0) < maxLeafLengthMeters;

                    if (isLeaf && isShort && kept.length > 1) {
                        changed = true;
                        return;
                    }

                    next.push(feature);
                });

                if (next.length === 0) break;
                kept = next;
            }

            return kept;
        }

        function shouldPruneStreetBranches(streetName) {
            return pruneStreetBranchNameSet.has(streetName);
        }

        function getPruneStreetBranchMaxLength(streetName) {
            return pruneStreetBranchMaxLengthByName[streetName] || 90;
        }

        function buildHighlightStreetGeojson(geojson) {
            var cloned = {};
            var grouped = {};

            (geojson.features || []).forEach(function (feature) {
                var streetName = feature.properties && feature.properties.strname;
                if (!highlightedStreetNameSet.has(streetName)) return;

                var copy = JSON.parse(JSON.stringify(feature));
                copy.properties = copy.properties || {};
                if (streetName === 'Eiergasse') {
                    copy.geometry.coordinates = trimLineEnd(copy.geometry.coordinates, 11);
                }
                copy.properties.__segment_length_m = roundNumber(getLineLengthMeters(getLineCoordinates(copy)), 1);
                if (!grouped[streetName]) grouped[streetName] = [];
                grouped[streetName].push(copy);
            });

            cloned.type = 'FeatureCollection';
            cloned.features = [];

            Object.keys(grouped).forEach(function (streetName) {
                cloned.features = cloned.features.concat(
                    shouldPruneStreetBranches(streetName)
                        ? pruneStreetBranchFeatures(grouped[streetName], getPruneStreetBranchMaxLength(streetName))
                        : grouped[streetName]
                );
            });

            return cloned;
        }

        function chapterNeedsStreetData(chapter) {
            if (TEMP_BASEMAP_PREVIEW) return false;
            return (chapter.onChapterEnter || []).some(function (item) {
                return item.layer === 'all-streets-context-thin' ||
                    item.layer === femaleStreetLayerId ||
                    item.layer === maleStreetLayerId ||
                    isStreetHighlightLayer(item.layer);
            });
        }

        function chapterNeedsSatellite(chapter) {
            if (TEMP_BASEMAP_PREVIEW) return false;
            return (chapter.onChapterEnter || []).some(function (item) {
                return item.layer === 'satellite-imagery';
            });
        }

        function getSatelliteInsertBeforeId() {
            if (map.getLayer('all-streets-context-thin')) return 'all-streets-context-thin';

            for (var i = 0; i < highlightStreetLayerConfigs.length; i += 1) {
                if (map.getLayer(highlightStreetLayerConfigs[i].id)) {
                    return highlightStreetLayerConfigs[i].id;
                }
            }

            return undefined;
        }

        function ensureSatelliteReady() {
            if (TEMP_BASEMAP_PREVIEW) return Promise.resolve();
            if (satelliteDataReady) return Promise.resolve();
            if (satelliteDataPromise) return satelliteDataPromise;

            satelliteDataPromise = Promise.resolve().then(function () {
                if (!map.getSource('satellite')) {
                    map.addSource('satellite', {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
                    });
                }

                if (!map.getLayer('satellite-imagery')) {
                    map.addLayer({
                        id: 'satellite-imagery',
                        type: 'raster',
                        source: 'satellite',
                        paint: { 'raster-opacity': 0 }
                    }, getSatelliteInsertBeforeId());
                }

                satelliteDataReady = true;
                var activeChapter = config.chapters[currentChapterIndex];
                if (activeChapter) {
                    applyChapterLayerState(getNonStreetHighlightItems(activeChapter.onChapterEnter || []), true);
                }
            }).catch(function () {
                satelliteDataPromise = null;
            });

            return satelliteDataPromise;
        }

        function ensureStreetDataReady() {
            if (TEMP_BASEMAP_PREVIEW) return Promise.resolve();
            if (streetDataReady) return Promise.resolve();
            if (streetDataPromise) return streetDataPromise;

            streetDataPromise = fetch('./data/strassen_berlin_wgs84.geojson')
                .then(function (response) { return response.json(); })
                .then(function (geojson) {
                    if (!geojson.features) return;

                    if (map.getSource('strassen')) {
                        map.getSource('strassen').setData(geojson);
                    } else {
                        map.addSource('strassen', {
                            type: 'geojson',
                            data: geojson
                        });

                        map.addLayer({
                            id: 'all-streets-context-thin',
                            type: 'line',
                            source: 'strassen',
                            layout: {
                                'line-cap': 'round',
                                'line-join': 'round'
                            },
                            paint: {
                                'line-color': '#f2efe8',
                                'line-width': [
                                    'interpolate', ['linear'], ['zoom'],
                                    14, 0.45,
                                    16, 0.7,
                                    18, 1.05
                                ],
                                'line-opacity': 0
                            }
                        });
                    }

                    var femaleStreetGeojson = buildGenderStreetGeojson(geojson, 'female');
                    var maleStreetGeojson = buildGenderStreetGeojson(geojson, 'male');

                    if (map.getSource(maleStreetSourceId)) {
                        map.getSource(maleStreetSourceId).setData(maleStreetGeojson);
                    } else {
                        map.addSource(maleStreetSourceId, {
                            type: 'geojson',
                            data: maleStreetGeojson
                        });

                        map.addLayer({
                            id: maleStreetLayerId,
                            type: 'line',
                            source: maleStreetSourceId,
                            layout: {
                                'line-cap': 'round',
                                'line-join': 'round'
                            },
                            paint: {
                                'line-color': '#f2efe8',
                                'line-width': [
                                    'interpolate', ['linear'], ['zoom'],
                                    10, 0.32,
                                    12, 0.48,
                                    15, 0.8
                                ],
                                'line-opacity': 0
                            }
                        });
                    }

                    if (map.getSource(femaleStreetSourceId)) {
                        map.getSource(femaleStreetSourceId).setData(femaleStreetGeojson);
                    } else {
                        map.addSource(femaleStreetSourceId, {
                            type: 'geojson',
                            data: femaleStreetGeojson
                        });

                        map.addLayer({
                            id: femaleStreetLayerId,
                            type: 'line',
                            source: femaleStreetSourceId,
                            layout: {
                                'line-cap': 'round',
                                'line-join': 'round'
                            },
                            paint: {
                                'line-color': '#ff5a5f',
                                'line-width': [
                                    'interpolate', ['linear'], ['zoom'],
                                    10, 0.42,
                                    12, 0.62,
                                    15, 1.05
                                ],
                                'line-opacity': 0
                            }
                        });
                    }

                    geojson.features.forEach(function (feature) {
                        var streetName = feature.properties && feature.properties.strname;
                        if (!streetName) return;

                        Object.keys(streetNamesByLayer).forEach(function (layerId) {
                            if (streetNamesByLayer[layerId].indexOf(streetName) === -1) return;
                            streetBoundsByLayer[layerId] = extendBoundsWithCoordinates(
                                streetBoundsByLayer[layerId] || null,
                                feature.geometry && feature.geometry.coordinates
                            );
                        });
                    });

                    var highlightGeojson = buildHighlightStreetGeojson(geojson);
                    if (map.getSource('highlight-strassen')) {
                        map.getSource('highlight-strassen').setData(highlightGeojson);
                    } else {
                        map.addSource('highlight-strassen', {
                            type: 'geojson',
                            data: highlightGeojson
                        });
                        highlightStreetLayerConfigs.forEach(function (l) {
                            map.addLayer({
                                id: streetGlowLayerIds[l.id],
                                type: 'line',
                                source: 'highlight-strassen',
                                filter: l.filter,
                                layout: {
                                    'line-cap': 'butt',
                                    'line-join': 'miter'
                                },
                                paint: {
                                    'line-color': l.color,
                                    'line-width': 10,
                                    'line-blur': 2,
                                    'line-opacity': 0
                                }
                            });

                            map.addLayer({
                                id: l.id,
                                type: 'line',
                                source: 'highlight-strassen',
                                filter: l.filter,
                                layout: {
                                    'line-cap': 'butt',
                                    'line-join': 'miter'
                                },
                                paint: {
                                    'line-color': '#ffffff',
                                    'line-width': 4,
                                    'line-opacity': 0
                                }
                            });
                        });
                    }

                    highlightLayersReady = true;
                    streetDataReady = true;
                    var activeChapter = config.chapters[currentChapterIndex];
                    if (activeChapter) {
                        applyChapterLayerState(getNonStreetHighlightItems(activeChapter.onChapterEnter || []), true);
                        if (getStreetHighlightItems(activeChapter.onChapterEnter || []).length) {
                            scheduleStreetHighlightStart(activeChapter);
                        }
                    }
                })
                .catch(function () {
                    // Fall back to configured chapter locations if bounds loading fails.
                    streetDataPromise = null;
                });

            return streetDataPromise;
        }

        function preloadStreetDataInBackground() {
            if (streetDataReady || streetDataPromise) return;

            var startPreload = function () {
                ensureStreetDataReady();
            };

            if ('requestIdleCallback' in window) {
                window.requestIdleCallback(startPreload, { timeout: 1500 });
            } else {
                window.setTimeout(startPreload, 450);
            }
        }

        function lngLatToWorldPixel(lng, lat, z) {
            var scale = 256 * Math.pow(2, z);
            var sinLat = Math.sin(lat * Math.PI / 180);
            var x = (lng + 180) / 360 * scale;
            var y = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale;
            return { x: x, y: y };
        }

        function normalizeTileX(x, z) {
            var worldSize = Math.pow(2, z);
            return ((x % worldSize) + worldSize) % worldSize;
        }

        function buildRasterTileUrl(template, z, x, y) {
            return template
                .replace('{z}', String(z))
                .replace('{x}', String(x))
                .replace('{y}', String(y));
        }

        function getChapterPrefetchZoomLevels(chapter) {
            var base = chapter.location.zoom + 1;
            var levels = [Math.floor(base), Math.ceil(base)];
            return levels.filter(function (value, index, list) {
                return value >= 0 && value <= 22 && list.indexOf(value) === index;
            });
        }

        function getChapterPrefetchTileUrls(chapter, template) {
            if (!map || !map.getCanvas()) return [];

            var canvas = map.getCanvas();
            var dpr = window.devicePixelRatio || 1;
            var width = (canvas.clientWidth || window.innerWidth) * dpr;
            var height = (canvas.clientHeight || window.innerHeight) * dpr;
            var padding = getChapterPadding(chapter);
            var left = (padding.left || 0) * dpr;
            var right = (padding.right || 0) * dpr;
            var top = (padding.top || 0) * dpr;
            var bottom = (padding.bottom || 0) * dpr;
            var screenCenterX = width / 2 + (left - right) / 2;
            var screenCenterY = height / 2 + (top - bottom) / 2;
            var margin = 384;
            var urls = [];

            getChapterPrefetchZoomLevels(chapter).forEach(function (z) {
                var center = lngLatToWorldPixel(chapter.location.center[0], chapter.location.center[1], z);
                var minPixelX = center.x - screenCenterX - margin;
                var maxPixelX = center.x + (width - screenCenterX) + margin;
                var minPixelY = center.y - screenCenterY - margin;
                var maxPixelY = center.y + (height - screenCenterY) + margin;
                var tileMinX = Math.floor(minPixelX / 256);
                var tileMaxX = Math.floor(maxPixelX / 256);
                var tileMinY = Math.max(0, Math.floor(minPixelY / 256));
                var tileMaxY = Math.min(Math.pow(2, z) - 1, Math.floor(maxPixelY / 256));

                for (var tileX = tileMinX; tileX <= tileMaxX; tileX += 1) {
                    for (var tileY = tileMinY; tileY <= tileMaxY; tileY += 1) {
                        urls.push(buildRasterTileUrl(template, z, normalizeTileX(tileX, z), tileY));
                    }
                }
            });

            return urls;
        }

        function prefetchRasterTilesForChapter(chapter, template) {
            getChapterPrefetchTileUrls(chapter, template).forEach(function (url) {
                if (prefetchedTileUrlSet.has(url)) return;
                prefetchedTileUrlSet.add(url);
                window.fetch(url, { mode: 'no-cors', cache: 'force-cache', credentials: 'omit' }).catch(function () {
                    prefetchedTileUrlSet.delete(url);
                });
            });
        }

        function prefetchChapterResources(chapter) {
            if (!chapter) return;

            if (chapterNeedsStreetData(chapter)) {
                ensureStreetDataReady();
            }

            var tonerPrefetchUrl = (config.style.sources.carto.tiles || [])[0] || '';
            if (tonerPrefetchUrl) {
                prefetchRasterTilesForChapter(chapter, tonerPrefetchUrl);
            }

            if (chapterNeedsSatellite(chapter)) {
                prefetchRasterTilesForChapter(
                    chapter,
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                );
            }
        }

        function shouldUseStreetBounds(chapter) {
            if (chapter.fitToStreetBounds === false) return false;

            var streetLayers = getStreetHighlightLayers(chapter.onChapterEnter || []);
            var hasSatellite = (chapter.onChapterEnter || []).some(function (item) {
                return item.layer === 'satellite-imagery';
            });
            return streetLayers.length === 1 && !hasSatellite;
        }

        function getChapterStreetBounds(chapter) {
            if (!shouldUseStreetBounds(chapter)) return null;

            var layerId = getStreetHighlightLayers(chapter.onChapterEnter)[0];
            var bounds = streetBoundsByLayer[layerId];
            if (!bounds) return null;

            return [
                [bounds[0], bounds[1]],
                [bounds[2], bounds[3]]
            ];
        }

        function getLayerPaintType(layer) {
            var mapLayer = map.getLayer(layer);
            if (!mapLayer) return null;
            return layerTypes[mapLayer.type];
        }

        function setLayerOpacity(layer) {
            if (TEMP_BASEMAP_PREVIEW) {
                if (
                    layer.layer === 'satellite-imagery' ||
                    layer.layer === 'all-streets-context-thin' ||
                    layer.layer === femaleStreetLayerId ||
                    layer.layer === maleStreetLayerId ||
                    isStreetHighlightLayer(layer.layer)
                ) {
                    return;
                }
            }

            var mapLayer = map.getLayer(layer.layer);
            if (!mapLayer) return;
            var layerType = mapLayer.type;

            if (layerType === 'line' && streetHighlightColors[layer.layer]) {
                var highlightColor = layer.color || (layer.opacity > 0 ? streetHighlightColors[layer.layer] : '#ffffff');
                var highlightOpacity = layer.highlightOpacity != null
                    ? layer.highlightOpacity
                    : (layer.opacity > 0 ? 1 : layer.opacity);
                var highlightWidth = layer.highlightWidth != null
                    ? layer.highlightWidth
                    : (layer.opacity > 0 ? 5 : 3.4);
                var opacityDuration = layer.opacity > 0 ? Math.min(layer.duration || 5000, 5000) : 500;
                var colorDuration = layer.opacity > 0 ? 3200 : 400;
                var widthDuration = layer.opacity > 0 ? 1400 : 320;
                var glowLayerId = streetGlowLayerIds[layer.layer];

                if (layer.duration) {
                    map.setPaintProperty(layer.layer, 'line-color-transition', { duration: colorDuration });
                    map.setPaintProperty(layer.layer, 'line-opacity-transition', { duration: opacityDuration });
                    map.setPaintProperty(layer.layer, 'line-width-transition', { duration: widthDuration });
                    if (glowLayerId) {
                        map.setPaintProperty(glowLayerId, 'line-opacity-transition', { duration: layer.opacity > 0 ? 1100 : 260 });
                    }
                }

                if (glowLayerId) {
                    map.setPaintProperty(glowLayerId, 'line-color', highlightColor);
                    map.setPaintProperty(glowLayerId, 'line-opacity', layer.opacity > 0 ? 0.04 : 0);
                }
                map.setPaintProperty(layer.layer, 'line-color', highlightColor);
                map.setPaintProperty(layer.layer, 'line-opacity', highlightOpacity);
                map.setPaintProperty(layer.layer, 'line-width', highlightWidth);
                return;
            }

            var paintProps = layerTypes[layerType];
            paintProps.forEach(function (prop) {
                if (layer.duration) {
                    map.setPaintProperty(layer.layer, prop + '-transition', { duration: layer.duration });
                }
                map.setPaintProperty(layer.layer, prop, layer.opacity);
            });
        }

        function setPaintIfLayerExists(layerId, prop, value) {
            if (map.getLayer(layerId)) {
                try {
                    map.setPaintProperty(layerId, prop, value);
                } catch (err) {
                    // Ignore unsupported paint properties on third-party basemap layers.
                }
            }
        }

        function setBasemapRoadPalette(caseColor, fillColor, transitionDuration) {
            basemapRoadCaseLayerIds.forEach(function (id) {
                setPaintIfLayerExists(id, 'line-color-transition', { duration: transitionDuration });
                setPaintIfLayerExists(id, 'line-color', caseColor);
            });

            basemapRoadFillLayerIds.forEach(function (id) {
                setPaintIfLayerExists(id, 'line-color-transition', { duration: transitionDuration });
                setPaintIfLayerExists(id, 'line-color', fillColor);
            });
        }

        function setBasemapRoadOpacity(opacity, transitionDuration) {
            basemapRoadCaseLayerIds.concat(basemapRoadFillLayerIds).forEach(function (id) {
                setPaintIfLayerExists(id, 'line-opacity-transition', { duration: transitionDuration });
                setPaintIfLayerExists(id, 'line-opacity', opacity);
            });
        }

        function tuneBasemap() {
            if (config.mapbox) return;
            ['landcover', 'park_national_park', 'park_nature_reserve', 'landuse'].forEach(function (id) {
                setPaintIfLayerExists(id, 'fill-color', '#181818');
            });
            setPaintIfLayerExists('background', 'background-color', '#181818');
            setPaintIfLayerExists('landuse_residential', 'fill-color', 'rgba(40, 40, 40, 0.28)');
            setPaintIfLayerExists('water', 'fill-color', '#3a4650');
            setPaintIfLayerExists('waterway', 'line-color', '#516675');
            setBasemapRoadPalette('#2c2c2c', '#4a4a4a', 0);
        }

        function setIntroRoadPalette(active) {
            if (active) {
                setBasemapRoadOpacity(0, 700);
            } else {
                setBasemapRoadOpacity(1, 500);
                setBasemapRoadPalette('#2c2c2c', '#4a4a4a', 500);
            }
        }

        function isIntroVisualChapter(chapter) {
            return chapter && chapter.id === 'credits';
        }

        function activateIntroEffects() {
            document.body.classList.add('intro-active');
            setIntroRoadPalette(true);
        }

        function deactivateIntroEffects() {
            document.body.classList.remove('intro-active');
            setIntroRoadPalette(false);
        }

        function syncIntroEffects() {
            deactivateIntroEffects();
        }

        var activeMapCalloutChapterId = null;
        var mapCalloutMoveHandler = null;

        function clearMapCallout() {
            activeMapCalloutChapterId = null;
            var container = document.getElementById('map-callouts');
            if (container) {
                container.classList.remove('is-visible');
                container.setAttribute('aria-hidden', 'true');
            }
            if (map && mapCalloutMoveHandler) {
                map.off('move', mapCalloutMoveHandler);
                map.off('resize', mapCalloutMoveHandler);
                mapCalloutMoveHandler = null;
            }
        }

        function getMapCalloutAnchors(mapCallout) {
            if (mapCallout.anchors && mapCallout.anchors.length) {
                return mapCallout.anchors.map(function (item) {
                    return {
                        lngLat: item.lngLat,
                        imageMarker: item.imageMarker || [0.5, 0.5],
                    };
                });
            }

            if (mapCallout.anchor) {
                return [{
                    lngLat: mapCallout.anchor,
                    imageMarker: mapCallout.imageMarker || [0.5, 0.5],
                }];
            }

            return [];
        }

        function getMapCalloutReferencePoint(mapCallout) {
            var anchors = getMapCalloutAnchors(mapCallout);
            if (!anchors.length || !map) return null;

            if (mapCallout.anchor) {
                return map.project(mapCallout.anchor);
            }

            var sumX = 0;
            var sumY = 0;
            anchors.forEach(function (item) {
                var point = map.project(item.lngLat);
                sumX += point.x;
                sumY += point.y;
            });

            return {
                x: sumX / anchors.length,
                y: sumY / anchors.length,
            };
        }

        function rebuildMapCalloutSvg(anchors, mapCallout) {
            var linesGroup = document.getElementById('map-callout-lines');
            var dotsGroup = document.getElementById('map-callout-dots');
            if (!linesGroup || !dotsGroup) return;

            var lineStyle = (mapCallout && mapCallout.lineStyle) || 'straight';
            var lineColor = (mapCallout && mapCallout.lineColor) || '#ff7876';
            var lineWidth = (mapCallout && mapCallout.lineWidth) || 2.5;

            linesGroup.innerHTML = '';
            dotsGroup.innerHTML = '';

            anchors.forEach(function () {
                var usePath = lineStyle === 'elbow' || lineStyle === 'rounded-elbow';
                var line = document.createElementNS('http://www.w3.org/2000/svg', usePath ? 'path' : 'line');
                line.setAttribute('class', 'map-callout-line');
                line.setAttribute('stroke', lineColor);
                line.setAttribute('stroke-width', lineWidth);
                linesGroup.appendChild(line);

                var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('class', 'map-callout-anchor-dot');
                dot.setAttribute('fill', lineColor);
                dot.setAttribute('r', Math.max(3, lineWidth + 0.5));
                dotsGroup.appendChild(dot);
            });
        }

        function getPanelEdgePoint(panelLeft, panelTop, panelWidth, panelHeight, targetX, targetY) {
            var centerX = panelLeft + panelWidth / 2;
            var centerY = panelTop + panelHeight / 2;
            var dx = targetX - centerX;
            var dy = targetY - centerY;

            if (!dx && !dy) {
                return { x: centerX, y: centerY };
            }

            var scaleX = dx !== 0 ? (panelWidth / 2) / Math.abs(dx) : Infinity;
            var scaleY = dy !== 0 ? (panelHeight / 2) / Math.abs(dy) : Infinity;
            var scale = Math.min(scaleX, scaleY);

            return {
                x: centerX + dx * scale,
                y: centerY + dy * scale,
            };
        }

        function getHorizontalPanelLineStart(panelLeft, panelTop, panelWidth, panelHeight, anchorPoint) {
            var y = Math.min(Math.max(anchorPoint.y, panelTop), panelTop + panelHeight);
            var x = anchorPoint.x >= panelLeft + panelWidth / 2
                ? panelLeft
                : panelLeft + panelWidth;
            return { x: x, y: y };
        }

        function positionMapCalloutPanel(mapCallout, referencePoint, anchorPoint, panelWidth, panelHeight) {
            var offset = mapCallout.offset || [132, -168];
            var rightInset = mapCallout.rightInset != null ? mapCallout.rightInset : 24;
            var minLeft = 16;
            var maxLeft = Math.max(minLeft, window.innerWidth - panelWidth - rightInset);
            var minTop = 16;
            var maxTop = Math.max(minTop, window.innerHeight - panelHeight - 16);
            var panelLeft;
            var panelTop;

            if (mapCallout.panelPlacement === 'toward-right') {
                var anchorBasedLeft = referencePoint.x + offset[0];
                anchorBasedLeft = Math.min(Math.max(minLeft, anchorBasedLeft), maxLeft);
                var targetLeft = maxLeft;
                panelLeft = anchorBasedLeft + (targetLeft - anchorBasedLeft) * 0.5;
            } else if (mapCallout.panelPlacement === 'right') {
                panelLeft = maxLeft;
            } else {
                panelLeft = referencePoint.x + offset[0];
                panelLeft = Math.min(Math.max(minLeft, panelLeft), maxLeft);
            }

            if (mapCallout.lineConnector === 'horizontal' && anchorPoint) {
                panelTop = anchorPoint.y - panelHeight / 2;
                if (mapCallout.panelVerticalOffset != null) {
                    panelTop += mapCallout.panelVerticalOffset;
                }
            } else {
                panelTop = referencePoint.y + offset[1];
            }

            panelTop = Math.min(Math.max(minTop, panelTop), maxTop);

            return { left: panelLeft, top: panelTop };
        }

        function setMapCalloutConnector(lineEl, x1, y1, x2, y2, lineStyle, index) {
            if (lineStyle === 'elbow' || lineStyle === 'rounded-elbow') {
                var radius = lineStyle === 'rounded-elbow' ? 16 : 0;
                var stagger = index * 34;
                var elbowY = y2 >= y1 ? y1 + 48 + stagger : y1 - 48 - stagger;
                var dirX = x2 >= x1 ? 1 : -1;
                var dirY = y2 >= elbowY ? 1 : -1;

                if (radius > 0) {
                    var d = [
                        'M', x1, y1,
                        'L', x1, elbowY - dirY * radius,
                        'Q', x1, elbowY, x1 + dirX * radius, elbowY,
                        'L', x2 - dirX * radius, elbowY,
                        'Q', x2, elbowY, x2, elbowY + dirY * radius,
                        'L', x2, y2,
                    ].join(' ');
                    lineEl.setAttribute('d', d);
                } else {
                    lineEl.setAttribute('d', [
                        'M', x1, y1,
                        'L', x1, elbowY,
                        'L', x2, elbowY,
                        'L', x2, y2,
                    ].join(' '));
                }

                lineEl.removeAttribute('points');
                lineEl.removeAttribute('x1');
                return;
            }

            lineEl.removeAttribute('d');
            lineEl.setAttribute('x1', x1);
            lineEl.setAttribute('y1', y1);
            lineEl.setAttribute('x2', x2);
            lineEl.setAttribute('y2', y2);
        }

        function updateMapCalloutGeometry() {
            if (!map || !activeMapCalloutChapterId) return;

            var chapter = config.chapters.find(function (chap) {
                return chap.id === activeMapCalloutChapterId;
            });
            if (!chapter || !chapter.mapCallout) return;

            var panel = document.getElementById('map-callout-panel');
            var image = document.getElementById('map-callout-image');
            var callouts = document.getElementById('map-callouts');
            var linesGroup = document.getElementById('map-callout-lines');
            var dotsGroup = document.getElementById('map-callout-dots');
            if (!panel || !callouts || !linesGroup || !dotsGroup) return;

            var mapCallout = chapter.mapCallout;
            var anchors = getMapCalloutAnchors(mapCallout);
            var referencePoint = getMapCalloutReferencePoint(mapCallout);
            if (!referencePoint || !anchors.length) return;

            var lineStyle = mapCallout.lineStyle || 'straight';
            var lineColor = mapCallout.lineColor || '#ff7876';
            var lineWidth = mapCallout.lineWidth || 2.5;
            var lineOrigin = mapCallout.lineOrigin || 'image';
            var panelWidth = panel.offsetWidth;
            var panelHeight = panel.offsetHeight;
            var primaryAnchorPoint = map.project(anchors[0].lngLat);
            var panelPosition = positionMapCalloutPanel(
                mapCallout,
                referencePoint,
                primaryAnchorPoint,
                panelWidth,
                panelHeight
            );

            panel.style.left = panelPosition.left + 'px';
            panel.style.top = panelPosition.top + 'px';

            var panelLeft = panelPosition.left;
            var panelTop = panelPosition.top;
            var calloutsRect = callouts.getBoundingClientRect();
            var lines = linesGroup.querySelectorAll('.map-callout-line');
            var dots = dotsGroup.querySelectorAll('.map-callout-anchor-dot');

            anchors.forEach(function (item, index) {
                var anchorPoint = map.project(item.lngLat);
                var lineStartX = panelLeft + (panelWidth * 0.5);
                var lineStartY = panelTop + (panelHeight * 0.5);

                if (mapCallout.lineConnector === 'horizontal') {
                    var horizontalStart = getHorizontalPanelLineStart(
                        panelLeft,
                        panelTop,
                        panelWidth,
                        panelHeight,
                        anchorPoint
                    );
                    lineStartX = horizontalStart.x;
                    lineStartY = horizontalStart.y;
                } else if (lineOrigin === 'panel-edge') {
                    var edgePoint = getPanelEdgePoint(panelLeft, panelTop, panelWidth, panelHeight, anchorPoint.x, anchorPoint.y);
                    lineStartX = edgePoint.x;
                    lineStartY = edgePoint.y;
                } else if (image && image.offsetWidth > 0 && image.offsetHeight > 0) {
                    var imageRect = image.getBoundingClientRect();
                    lineStartX = imageRect.left - calloutsRect.left + (imageRect.width * item.imageMarker[0]);
                    lineStartY = imageRect.top - calloutsRect.top + (imageRect.height * item.imageMarker[1]);
                }

                if (lines[index]) {
                    lines[index].setAttribute('stroke', lineColor);
                    lines[index].setAttribute('stroke-width', lineWidth);
                    setMapCalloutConnector(lines[index], lineStartX, lineStartY, anchorPoint.x, anchorPoint.y, lineStyle, index);
                }

                if (dots[index]) {
                    dots[index].setAttribute('fill', lineColor);
                    dots[index].setAttribute('r', Math.max(3, lineWidth + 0.5));
                    dots[index].setAttribute('cx', anchorPoint.x);
                    dots[index].setAttribute('cy', anchorPoint.y);
                }
            });
        }

        function showMapCallout(chapter) {
            if (!chapter || !chapter.mapCallout) {
                clearMapCallout();
                return;
            }

            var container = document.getElementById('map-callouts');
            var text = document.getElementById('map-callout-text');
            var image = document.getElementById('map-callout-image');
            var caption = document.getElementById('map-callout-caption');
            if (!container || !text || !image || !caption) return;

            var mapCallout = chapter.mapCallout;
            var anchors = getMapCalloutAnchors(mapCallout);
            rebuildMapCalloutSvg(anchors, mapCallout);

            activeMapCalloutChapterId = chapter.id;
            text.innerHTML = mapCallout.text || '';
            text.style.display = mapCallout.text ? 'block' : 'none';
            image.src = mapCallout.image || '';
            image.alt = mapCallout.imageAlt || '';
            if (mapCallout.captionHtml) {
                caption.innerHTML = mapCallout.captionHtml;
            } else {
                caption.textContent = mapCallout.caption || '';
            }
            image.style.display = mapCallout.image ? 'block' : 'none';
            image.style.marginTop = mapCallout.text ? '10px' : '0';
            caption.style.display = (mapCallout.captionHtml || mapCallout.caption) ? 'block' : 'none';
            image.onload = function () {
                updateMapCalloutGeometry();
            };

            container.classList.remove('is-visible');
            container.setAttribute('aria-hidden', 'true');

            window.requestAnimationFrame(function () {
                window.requestAnimationFrame(function () {
                    container.classList.add('is-visible');
                    container.setAttribute('aria-hidden', 'false');
                    updateMapCalloutGeometry();
                });
            });

            if (!mapCalloutMoveHandler) {
                mapCalloutMoveHandler = function () {
                    updateMapCalloutGeometry();
                };
                map.on('move', mapCalloutMoveHandler);
                map.on('resize', mapCalloutMoveHandler);
            }
        }

        function revealMap() {
            if (document.body.classList.contains('map-active')) return;
            document.body.classList.add('map-active');
            var splash = document.getElementById('start-splash');
            if (splash) splash.setAttribute('aria-hidden', 'true');
        }

        function enterIntroView() {
            if (!document.body.classList.contains('start-active')) return;
            document.body.classList.remove('start-active');
            document.body.classList.add('intro-chapter-active');
            var cue = document.getElementById('scroll-cue');
            if (cue) cue.setAttribute('aria-hidden', 'true');
            revealMap();
            var intro = config.chapters[0];
            if (map && intro) {
                intro.padding = getChapterPadding(intro);
                StoryLayers.enterChapter(intro);
                moveToChapter(intro, false);
            }
        }

        function handleStartSplashScroll() {
            if (document.body.classList.contains('start-active') && window.scrollY > 12) {
                enterIntroView();
            }
        }

        window.addEventListener('scroll', handleStartSplashScroll, { passive: true });
        window.addEventListener('scroll', function () {
            if (pendingStreetHighlightChapterId) {
                var chapter = config.chapters.find(function (chap) {
                    return chap.id === pendingStreetHighlightChapterId;
                });
                if (chapter) scheduleStreetHighlightStart(chapter);
            }
        }, { passive: true });

        function getChapterPadding(chapter) {
            var isMobile = window.innerWidth <= 900;
            if (isMobile) {
                return { top: 110, right: 16, bottom: 32, left: 16 };
            }

            if (chapter && chapter.id === 'intro') {
                return { top: 40, right: 40, bottom: 40, left: 40 };
            }

            if (chapter && chapter.id === 'hirsch-odf') {
                var hirschPanelWidth = Math.min(490, window.innerWidth - 56);
                var hirschSidePadding = Math.round(hirschPanelWidth + Math.min(window.innerWidth * 0.08, 96));
                return { top: 110, right: 140, bottom: 40, left: hirschSidePadding };
            }

            if (isIntroVisualChapter(chapter)) {
                return { top: 0, right: 0, bottom: 0, left: 0 };
            }

            var panelWidth = Math.min(490, window.innerWidth - 56);
            var sidePadding = Math.round(panelWidth + Math.min(window.innerWidth * 0.08, 96));
            var basePadding = { top: 110, right: 8, bottom: 40, left: 8 };

            if (chapter.alignment === 'right') {
                basePadding.right = sidePadding;
            } else {
                basePadding.left = sidePadding;
            }

            return basePadding;
        }

        function getChapterCameraOptions(chapter) {
            if (isIntroVisualChapter(chapter)) {
                return Object.assign({}, chapter.location);
            }

            return Object.assign({}, chapter.location, {
                padding: getChapterPadding(chapter)
            });
        }

        function getMapEasing() {
            return StoryLayers && StoryLayers.easeInOutCubic
                ? StoryLayers.easeInOutCubic
                : function (t) {
                    return t;
                };
        }

        function getMapFlyDuration() {
            return StoryLayers && StoryLayers.getFlyDuration
                ? StoryLayers.getFlyDuration()
                : (config.mapFlyDuration || 2800);
        }

        function moveToChapter(chapter, immediate) {
            var bounds = getChapterStreetBounds(chapter);
            var flyDuration = immediate ? 0 : getMapFlyDuration();
            var easing = getMapEasing();

            if (bounds) {
                map.fitBounds(bounds, {
                    padding: getChapterPadding(chapter),
                    bearing: chapter.location.bearing,
                    pitch: chapter.location.pitch,
                    duration: flyDuration,
                    easing: easing,
                    maxZoom: chapter.location.zoom
                });
                return;
            }

            var camera = getChapterCameraOptions(chapter);
            if (immediate) {
                map.jumpTo(camera);
            } else {
                map.flyTo(Object.assign({}, camera, {
                    duration: flyDuration,
                    easing: easing
                }));
            }
        }

        function updateMapAnchorUi(message) {
            var chapterLabel = document.getElementById('map-anchor-chapter');
            var output = document.getElementById('map-anchor-output');
            var toggleButton = document.getElementById('toggle-map-edit');
            var tools = document.getElementById('map-anchor-tools');

            if (chapterLabel) {
                chapterLabel.textContent = config.chapters[currentChapterIndex].id;
            }
            if (toggleButton) {
                toggleButton.textContent = isMapEditMode ? 'Lock map' : 'Edit map';
                toggleButton.classList.toggle('is-active', isMapEditMode);
            }
            if (tools) {
                tools.classList.toggle('is-editing', isMapEditMode);
            }
            if (output && message) {
                output.textContent = message;
            }
        }

        function setMapInteractionsEnabled(enabled) {
            if (!map) return;
            if (!enabled) {
                if (map.dragPan) map.dragPan.disable();
                if (map.scrollZoom) map.scrollZoom.disable();
                if (map.boxZoom) map.boxZoom.disable();
                if (map.doubleClickZoom) map.doubleClickZoom.disable();
                if (map.touchZoomRotate) map.touchZoomRotate.disable();
                if (map.touchPitch) map.touchPitch.disable();
                if (map.keyboard) map.keyboard.disable();
                if (map.getCanvas()) {
                    map.getCanvas().style.cursor = 'default';
                    map.getCanvas().style.pointerEvents = 'none';
                }
                return;
            }

            if (map.getCanvas()) {
                map.getCanvas().style.cursor = 'grab';
                map.getCanvas().style.pointerEvents = 'auto';
            }
            if (map.dragPan) map.dragPan.enable();
            if (map.boxZoom) map.boxZoom.disable();
            if (map.doubleClickZoom) map.doubleClickZoom.disable();
            if (map.keyboard) map.keyboard.disable();

            if (isMapEditMode) {
                if (map.scrollZoom) map.scrollZoom.enable();
                if (map.touchZoomRotate) map.touchZoomRotate.enable();
                if (map.touchPitch) map.touchPitch.enable();
            } else {
                /* Wheel zoom off — conflicts with scrollytelling. Use +/- or two-finger pinch. */
                if (map.scrollZoom) map.scrollZoom.disable();
                if (map.touchZoomRotate) map.touchZoomRotate.enable();
                if (map.touchPitch) map.touchPitch.disable();
            }
        }

        function setMapEditingMode(enabled) {
            isMapEditMode = enabled;
            document.body.classList.toggle('map-editing', enabled);
            setMapInteractionsEnabled(true);
            if (map.dragRotate) enabled ? map.dragRotate.enable() : map.dragRotate.disable();
            updateMapAnchorUi(enabled
                ? 'Drag to pan. Wheel to zoom. Right-drag or Ctrl-drag to rotate/pitch. Click Anchor to save the current slide view.'
                : 'Karte: zoomen mit +/− oder zwei Fingern, verschieben mit ziehen.');
        }

        function formatChapterLocation(chapter) {
            return [
                chapter.id + ': {',
                '  fitToStreetBounds: false,',
                '  location: {',
                '    center: [' + chapter.location.center[0] + ', ' + chapter.location.center[1] + '],',
                '    zoom: ' + chapter.location.zoom + ',',
                '    pitch: ' + chapter.location.pitch + ',',
                '    bearing: ' + chapter.location.bearing,
                '  }',
                '}'
            ].join('\n');
        }

        function saveCurrentMapAnchor() {
            var chapter = config.chapters[currentChapterIndex];
            var center = map.getCenter();
            chapter.location = {
                center: [roundNumber(center.lng, 6), roundNumber(center.lat, 6)],
                zoom: roundNumber(map.getZoom(), 2),
                pitch: roundNumber(map.getPitch(), 1),
                bearing: roundNumber(map.getBearing(), 1)
            };
            chapter.fitToStreetBounds = false;

            var overrides = getSavedCameraOverrides();
            overrides[chapter.id] = { location: chapter.location };
            try {
                window.localStorage.setItem(CAMERA_OVERRIDE_STORAGE_KEY, JSON.stringify(overrides));
            } catch (err) {
                // Ignore storage failures and still show the values for manual copy.
            }

            var output = formatChapterLocation(chapter);
            updateMapAnchorUi(output + '\n\nCopied to clipboard.');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(output).catch(function () {
                    updateMapAnchorUi(output + '\n\nClipboard blocked. Copy manually from here.');
                });
            }
        }

        // Build story DOM
        function initRotatedChapterFigures(root) {
            (root || document).querySelectorAll('.chapter-figure--rotate-left img').forEach(function (img) {
                function applyAspectRatio() {
                    var wrap = img.closest('.chapter-figure-rotate');
                    if (!wrap || !img.naturalWidth || !img.naturalHeight) return;
                    wrap.style.aspectRatio = img.naturalHeight + ' / ' + img.naturalWidth;
                }

                if (img.complete) applyAspectRatio();
                else img.addEventListener('load', applyAspectRatio, { once: true });
            });
        }

        function initSplitCropFigures(root) {
            (root || document).querySelectorAll('.chapter-figure--split-crop').forEach(function (figure) {
                var splits = figure.querySelectorAll('.chapter-figure-split');
                if (splits.length < 2) return;

                var leftImg = splits[0].querySelector('.chapter-figure-image img');
                var rightCrop = splits[1].querySelector('.chapter-figure-image--crop');
                if (!leftImg || !rightCrop) return;

                function syncHeights() {
                    if (!leftImg.offsetHeight) return;
                    rightCrop.style.height = leftImg.offsetHeight + 'px';
                }

                syncHeights();
                if (!leftImg.complete) {
                    leftImg.addEventListener('load', syncHeights, { once: true });
                }
            });
        }

        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');

            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }

            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }

            if (record.description) {
                var desc = document.createElement('div');
                desc.className = 'chapter-body';
                desc.innerHTML = record.description;
                chapter.appendChild(desc);
            }

            container.setAttribute('id', record.id);
            container.classList.add('step');
            container.setAttribute('data-scrollama-index', String(idx));
            if (idx === 0) container.classList.add('active');

            if (chapter.childNodes.length > 0) {
                chapter.classList.add(config.theme);
                chapter.classList.add('card');
                container.appendChild(chapter);
            }
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) container.classList.add('hidden');
            features.appendChild(container);
        });

        initRotatedChapterFigures(features);
        initSplitCropFigures(features);
        story.appendChild(features);

        var footer = document.createElement('div');

        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }

        if (footer.innerText.length > 0) {
            footer.classList.add(config.theme);
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        if (config.mapbox && getMapboxAccessToken()) {
            document.body.classList.add('mapbox-basemap');
        } else if (config.mapbox) {
            console.error(
                'Mapbox token missing. Ensure config.local.js exists and sets window.MAPBOX_ACCESS_TOKEN.'
            );
        }

        var mapOptions = {
            container: 'map',
            style: getResolvedMapStyle(),
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            attributionControl: false,
            interactive: true,
            scrollZoom: false,
            boxZoom: false,
            doubleClickZoom: false,
            touchZoomRotate: true,
            touchPitch: false,
            dragPan: true
        };

        var map = new maplibregl.Map(mapOptions);

        map.addControl(new maplibregl.AttributionControl({ compact: true }));

        function bindMapZoomControls() {
            var zoomInBtn = document.getElementById('map-zoom-in');
            var zoomOutBtn = document.getElementById('map-zoom-out');
            if (!zoomInBtn || !zoomOutBtn) return;

            zoomInBtn.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                map.zoomIn({ duration: 280 });
            });
            zoomOutBtn.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                map.zoomOut({ duration: 280 });
            });
        }

        bindMapZoomControls();

        map.on('error', function (event) {
            var message =
                (event && event.error && event.error.message) ||
                (event && event.message) ||
                'Unknown map error';
            console.error('Map error:', message, event);
        });

        if (config.showMarkers) {
            var marker = new maplibregl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        var toggleMapEditButton = document.getElementById('toggle-map-edit');
        var saveMapAnchorButton = document.getElementById('save-map-anchor');
        if (toggleMapEditButton) {
            toggleMapEditButton.addEventListener('click', function () {
                setMapEditingMode(!isMapEditMode);
            });
        }
        if (saveMapAnchorButton) {
            saveMapAnchorButton.addEventListener('click', function () {
                saveCurrentMapAnchor();
            });
        }
        updateMapAnchorUi('Edit mode off.');

        var scroller = scrollama();

        map.on('load', function () {
            map.resize();
            setMapInteractionsEnabled(true);
            if (map.dragRotate) map.dragRotate.disable();
            setMapEditingMode(false);
            tuneBasemap();
            StoryLayers.init(map);
            syncIntroEffects();

            scroller
                .setup({
                    step: '.step',
                    offset: 0.5,
                    progress: true
                })
                .onStepEnter(response => {
                    currentChapterIndex = config.chapters.findIndex(function (chap) {
                        return chap.id === response.element.id;
                    });
                    if (currentChapterIndex < 0) return;
                    var chapter = config.chapters[currentChapterIndex];

                    response.element.classList.add('active');
                    if (currentChapterIndex === 0) {
                        if (response.direction === 'down') {
                            enterIntroView();
                        } else if (document.body.classList.contains('map-active')) {
                            document.body.classList.add('intro-chapter-active');
                            chapter.padding = getChapterPadding(chapter);
                            StoryLayers.enterChapter(chapter);
                        }
                    }
                    if (currentChapterIndex >= 1) {
                        document.body.classList.remove('intro-chapter-active');
                        revealMap();
                    }
                    var isInitialIntroEntry = !hasInitializedFirstChapter && currentChapterIndex === 0;
                    var usesStoryLayers =
                        chapter.storyLayers ||
                        chapter.layerSequence ||
                        chapter.mapClusterHover;

                    if (usesStoryLayers) {
                        chapter.padding = getChapterPadding(chapter);
                        StoryLayers.enterChapter(chapter);
                    }

                    var storyHandlesCamera =
                        chapter.keepCamera ||
                        (usesStoryLayers &&
                            (chapter.layerSequence ||
                                (chapter.fitStoryBounds !== false && chapter.storyLayers)));
                    if (!storyHandlesCamera && currentChapterIndex !== 0) {
                        moveToChapter(chapter, isInitialIntroEntry);
                    } else if (currentChapterIndex === 0 && document.body.classList.contains('map-active') && response.direction !== 'down') {
                        moveToChapter(chapter, false);
                    }

                    hasInitializedFirstChapter = true;
                    updateMapAnchorUi();

                    if (config.showMarkers) marker.setLngLat(chapter.location.center);
                    if (!usesStoryLayers && chapter.onChapterEnter.length > 0) {
                        if (chapterNeedsSatellite(chapter)) ensureSatelliteReady();
                        if (chapterNeedsStreetData(chapter)) ensureStreetDataReady();
                        applyChapterLayerState(getNonStreetHighlightItems(chapter.onChapterEnter), true);
                        scheduleStreetHighlightStart(chapter);
                    }
                    syncIntroEffects();
                    if (chapter.mapCallout) {
                        showMapCallout(chapter);
                    } else {
                        clearMapCallout();
                    }
                    if (chapter.callback) window[chapter.callback]();
                    if (chapter.rotateAnimation) {
                        map.once('moveend', () => {
                            const rotateNumber = map.getBearing();
                            map.rotateTo(rotateNumber + 180, {
                                duration: 30000,
                                easing: t => t
                            });
                        });
                    }
                    if (config.auto) {
                        var next_chapter = (currentChapterIndex + 1) % config.chapters.length;
                        map.once('moveend', () => {
                            document.querySelectorAll('[data-scrollama-index="' + next_chapter + '"]')[0].scrollIntoView();
                        });
                    }

                })
                .onStepProgress(response => {
                    var chapter = config.chapters.find(chap => chap.id === response.element.id);
                    if (!chapter || !chapter.onChapterEnter.length) return;
                    updateStreetHighlightFadeForChapter(chapter, response.progress);
                })
                .onStepExit(response => {
                    var chapter = config.chapters.find(function (chap) {
                        return chap.id === response.element.id;
                    });
                    response.element.classList.remove('active');
                    if (!chapter) return;
                    if (chapter.id === 'intro') {
                        document.body.classList.remove('intro-chapter-active');
                    }
                    if (pendingStreetHighlightChapterId === chapter.id) {
                        clearPendingStreetHighlight();
                        pendingStreetHighlightChapterId = null;
                    }
                    if (activeStreetHighlightChapterId === chapter.id) {
                        activeStreetHighlightChapterId = null;
                    }
                    if (chapter.storyLayers || chapter.layerSequence || chapter.mapClusterHover) {
                        StoryLayers.exitChapter(chapter);
                    } else if (chapter.onChapterExit.length > 0) {
                        applyChapterLayerState(chapter.onChapterExit, false);
                    }
                    if (chapter.mapCallout) {
                        clearMapCallout();
                    }
                    syncIntroEffects();
                });

            if (config.auto) {
                document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
            }

            moveToChapter(config.chapters[0], true);
        });

        window.addEventListener('resize', function () {
            if (map) map.resize();
            updateMapCalloutGeometry();
        });
    </script>

</body>
