<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8' />
    <title>Re:Name THIS!</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' rel='stylesheet' />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/scrollama@3.2.0/build/scrollama.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1113;
            --panel: rgba(12, 14, 16, 0.7);
            --panel-strong: rgba(8, 9, 11, 0.92);
            --line: rgba(255, 255, 255, 0.1);
            --text: #f4f4f1;
            --muted: #b8b8b0;
            --title: #ff7876;
            --accent: #ff7876;
            --gold: #d2a654;
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Barlow Condensed", system-ui, sans-serif;
            font-weight: 400;
        }

        body {
            overflow-x: hidden;
        }

        #chrome {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        a,
        a:hover,
        a:visited {
            color: var(--text);
        }

        #map-shell {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 68, 75, 0.18), transparent 28%),
                radial-gradient(circle at 80% 0%, rgba(210, 166, 84, 0.14), transparent 24%),
                #111416;
        }

        #map {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
            pointer-events: auto;
        }

        #map-shell {
            pointer-events: none;
        }

        #map-shell #map,
        #map-shell .maplibregl-control-container {
            pointer-events: auto;
        }

        .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib {
            margin: 0 10px 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(10, 12, 14, 0.78);
            backdrop-filter: blur(10px);
        }

        .maplibregl-ctrl-attrib.maplibregl-compact {
            color: var(--text);
            padding-right: 0;
        }

        .maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-button {
            display: block;
            background-color: transparent;
            filter: invert(1) brightness(1.25);
        }

        .maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner {
            display: none !important;
        }

        .map-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                linear-gradient(90deg, rgba(8, 9, 11, 0.72) 0%, rgba(8, 9, 11, 0.38) 30%, rgba(8, 9, 11, 0) 58%),
                linear-gradient(0deg, rgba(8, 9, 11, 0.76) 0%, rgba(8, 9, 11, 0) 38%);
        }

        body.basemap-preview .map-overlay {
            display: none;
        }

        body.basemap-preview #map-shell {
            background: #f2f0eb;
        }

        body.mapbox-basemap #map-shell {
            background: #e8e4df;
        }

        body.mapbox-basemap .map-overlay {
            background:
                linear-gradient(90deg, rgba(8, 9, 11, 0.42) 0%, rgba(8, 9, 11, 0.18) 32%, rgba(8, 9, 11, 0) 58%),
                linear-gradient(0deg, rgba(8, 9, 11, 0.45) 0%, rgba(8, 9, 11, 0) 38%);
        }

        body.intro-chapter-active.mapbox-basemap .map-overlay {
            background:
                linear-gradient(90deg, rgba(8, 9, 11, 0.59) 0%, rgba(8, 9, 11, 0.25) 32%, rgba(8, 9, 11, 0) 58%),
                linear-gradient(0deg, rgba(8, 9, 11, 0.63) 0%, rgba(8, 9, 11, 0) 38%);
        }

        #story {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        #story .step > div,
        #story #footer {
            pointer-events: auto;
        }

        body.map-editing #story {
            pointer-events: none;
        }

        #map-zoom-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }

        #map-zoom-controls button {
            width: 48px;
            height: 48px;
            margin: 0;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            background: rgba(10, 12, 14, 0.82);
            backdrop-filter: blur(10px);
            color: var(--text);
            font: 600 26px/1 "Barlow Condensed", system-ui, sans-serif;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 180ms ease, border-color 180ms ease, transform 120ms ease;
        }

        #map-zoom-controls button:hover {
            background: rgba(22, 24, 26, 0.92);
            border-color: rgba(255, 255, 255, 0.32);
        }

        #map-zoom-controls button:active {
            transform: scale(0.96);
        }

        #start-splash {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: opacity 520ms ease, visibility 520ms ease;
        }

        #start-splash img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        body.map-active #start-splash {
            opacity: 0;
            visibility: hidden;
        }

        #scroll-cue {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 35;
            height: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            color: #4a4a4a;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: lowercase;
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: opacity 360ms ease, visibility 360ms ease;
        }

        #scroll-cue-arrow {
            font-size: 33px;
            line-height: 1;
        }

        body:not(.start-active) #scroll-cue {
            opacity: 0;
            visibility: hidden;
        }

        body:not(.map-active) #map-shell,
        body:not(.map-active) #map-zoom-controls {
            opacity: 0;
            pointer-events: none;
        }

        #map-shell,
        #map-zoom-controls {
            transition: opacity 520ms ease;
        }

        body:not(.map-active) #story .step > div {
            opacity: 0;
            visibility: hidden;
        }

        body.map-active #story {
            z-index: 40;
        }

        #story .step > div {
            transition: opacity 520ms ease, visibility 520ms ease;
        }

        #features {
            padding-top: 100px;
            padding-bottom: 6vh;
        }

        .hidden {
            visibility: hidden;
        }

        .step {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 24px 56px;
            opacity: 1;
        }

        .lefty {
            justify-content: flex-start;
        }

        .centered,
        .fully {
            justify-content: center;
        }

        .righty {
            justify-content: flex-end;
        }

        .step > div {
            width: min(490px, calc(100vw - 56px));
            border: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            opacity: 1;
            transition: border-color 260ms ease, box-shadow 260ms ease;
        }

        .step.active > div {
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        }

        #dekolonial-berlin.active {
            pointer-events: none;
        }

        #dekolonial-berlin.active > .card {
            pointer-events: none;
        }

        #dekolonial-berlin.active > .card a {
            pointer-events: auto;
        }

        .lefty > div,
        .centered > div,
        .fully > div {
            margin-left: clamp(28px, 4vw, 72px);
            margin-right: auto;
        }

        .righty > div {
            margin-right: clamp(28px, 4vw, 72px);
        }

        .light,
        .dark {
            color: var(--text);
            background: transparent;
        }

        .card {
            padding: clamp(16px, 2.4vw, 28px);
        }

        .card h3,
        .card p {
            margin: 0 0 16px;
        }

        .card h3 {
            color: var(--title);
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-weight: 600;
            font-size: clamp(22px, 2.6vw, 32px);
            line-height: 1.02;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card p {
            color: var(--text);
            font-size: clamp(16px, 1.28vw, 19px);
            line-height: 1.38;
            text-align: left;
        }

        .card p:last-child {
            margin-bottom: 0;
        }

        .card .chapter-body p {
            margin: 0 0 16px;
            color: var(--text);
            font-size: clamp(16px, 1.28vw, 19px);
            line-height: 1.38;
            text-align: left;
        }

        .card .chapter-body p:last-child {
            margin-bottom: 0;
        }

        .card .chapter-body .legal-links {
            margin-top: 1rem;
            font-size: 11px;
            line-height: 1.35;
            color: rgba(244, 244, 241, 0.42);
        }

        .card .chapter-body .legal-links a {
            color: inherit;
            text-decoration: none;
        }

        .card .chapter-body .legal-links a:hover {
            color: rgba(244, 244, 241, 0.68);
        }

        .card .chapter-body {
            --chapter-figure-caption-gap: 18px;
        }

        .card .chapter-body .chapter-section-spacer {
            margin: 32px 0 8px;
        }

        .card .chapter-body .chapter-figure {
            margin: 16px 0 0;
            width: 100%;
        }

        .card .chapter-body .chapter-figure img {
            margin: 0;
        }

        .card .chapter-body .chapter-figure figcaption {
            margin: var(--chapter-figure-caption-gap) 0 0;
            color: rgba(244, 244, 241, 0.68);
            font-size: 13px;
            line-height: 1.35;
            text-align: left;
        }

        .card .chapter-body .chapter-figure--half {
            width: 50%;
        }

        .card .chapter-body .chapter-figure--half figcaption {
            text-align: left;
        }

        .card .chapter-body .chapter-figure--pair-caption .chapter-figure-pair {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }

        .card .chapter-body .chapter-figure--pair-caption .chapter-figure-pair img {
            flex: 1 1 50%;
            min-width: 0;
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card .chapter-body .chapter-figure--pair-caption figcaption {
            text-align: left;
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-pair {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            width: 100%;
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-split {
            flex: 1 1 50%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--chapter-figure-caption-gap);
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-image {
            width: 100%;
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-image img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-image--crop {
            overflow: hidden;
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-image--crop img {
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .card .chapter-body .chapter-figure--split-crop .chapter-figure-split figcaption {
            margin: 0;
            text-align: left;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split figcaption {
            margin: 0;
            text-align: left;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            column-gap: 8px;
            row-gap: var(--chapter-figure-caption-gap);
            width: 100%;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split {
            display: contents;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split:nth-child(1) img {
            grid-column: 1;
            grid-row: 1;
            align-self: end;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split:nth-child(1) figcaption {
            grid-column: 1;
            grid-row: 2;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split:nth-child(2) img {
            grid-column: 2;
            grid-row: 1;
            align-self: end;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split:nth-child(2) figcaption {
            grid-column: 2;
            grid-row: 2;
        }

        .card .chapter-body .chapter-figure--split .chapter-figure-split img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card .chapter-body .chapter-figure > img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card .chapter-body .chapter-figure--pair .chapter-figure-pair {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .card .chapter-body .chapter-figure--pair .chapter-figure-pair img {
            flex: 1 1 50%;
            min-width: 0;
            width: 100%;
            height: auto;
            object-fit: initial;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card .chapter-body .chapter-figure--rotate-left .chapter-figure-rotate {
            width: 100%;
            position: relative;
            overflow: hidden;
            line-height: 0;
            aspect-ratio: 3 / 4;
            container-type: inline-size;
        }

        .card .chapter-body .chapter-figure--rotate-left img {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: auto;
            height: 100cqw;
            max-width: none;
            transform: translate(-50%, -50%) rotate(-90deg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @supports not (height: 1cqw) {
            .card .chapter-body .chapter-figure--rotate-left .chapter-figure-rotate {
                height: 0;
                padding-bottom: 133.333%;
            }

            .card .chapter-body .chapter-figure--rotate-left img {
                height: 75%;
            }
        }

        .card p b,
        .card p strong {
            color: var(--accent);
            font-weight: 600;
        }

        #intro.step {
            justify-content: center;
            align-items: center;
        }

        #intro.step > div {
            width: calc(100vw - clamp(48px, 8vw, 120px));
            max-width: none;
            margin-left: auto;
            margin-right: auto;
        }

        #intro .chapter-intro__content {
            min-width: 0;
        }

        #intro .chapter-intro__title {
            margin: 0 0 20px;
            color: var(--accent);
            font-family: "Oswald", "Arial Narrow", sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 3.2vw, 42px);
            line-height: 1.05;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: left;
        }

        #intro .chapter-intro__prose p {
            margin: 0 0 20px;
            color: var(--text);
            font-size: clamp(19px, 1.9vw, 26px);
            line-height: 1.42;
            text-align: left;
        }

        #intro .chapter-intro__prose p:last-child {
            margin-bottom: 0;
        }

        #story-hover-popup {
            position: fixed;
            z-index: 65;
            max-width: min(320px, calc(100vw - 24px));
            padding: 12px 14px;
            border: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            color: var(--text);
            font-size: 13px;
            line-height: 1.35;
            pointer-events: none;
        }

        #story-hover-popup .story-hover-popup-name {
            display: block;
            font-weight: 700;
        }

        #story-hover-popup .story-hover-popup-former {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text);
        }

        #story-hover-popup:has(.story-hover-popup--street) {
            max-width: min(560px, calc(100vw - 24px));
            padding: 5px 8px;
            background: rgba(12, 14, 16, 0.5);
            font-size: 12px;
            line-height: 1.2;
        }

        #story-hover-popup .story-hover-popup--street {
            display: inline-block;
            white-space: nowrap;
        }

        #story-hover-popup .story-hover-popup--street .story-hover-popup-name,
        #story-hover-popup .story-hover-popup--street .story-hover-popup-former {
            display: inline;
            margin-top: 0;
            font-size: inherit;
            font-weight: 400;
        }

        #story-hover-popup .story-hover-popup--street .story-hover-popup-name {
            font-weight: 700;
        }

        #story-hover-popup strong {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        #story-hover-popup ul {
            margin: 0;
            padding-left: 1.1em;
        }

        #story-hover-popup li {
            margin-bottom: 4px;
        }

        .card img {
            width: 100%;
            display: block;
            margin: 0 0 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #footer {
            position: relative;
            z-index: 15;
            width: min(720px, calc(100vw - 64px));
            margin: 0 0 40px clamp(52px, 6vw, 96px);
            padding: 18px 22px;
            border: 1px solid var(--line);
            background: rgba(10, 12, 14, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            line-height: 1.5;
            font: 600 12px/1.4 "Barlow Condensed", system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        #footer p {
            margin: 0;
        }

        @media (max-width: 900px) {
            .map-overlay {
                background:
                    linear-gradient(0deg, rgba(8, 9, 11, 0.82) 0%, rgba(8, 9, 11, 0.32) 28%, rgba(8, 9, 11, 0) 56%);
            }

            .centered,
            .lefty,
            .righty,
            .fully {
                justify-content: center;
            }

            .step {
                align-items: flex-end;
                padding: 108px 14px 24px;
            }

            #intro.step {
                align-items: center;
            }

            #intro.step > div {
                width: calc(100vw - 28px);
            }

            #intro .chapter-intro__prose p {
                font-size: clamp(18px, 4.6vw, 24px);
            }

            .step > div,
            .lefty > div,
            .righty > div,
            .centered > div,
            .fully > div,
            #footer {
                width: calc(100vw - 28px);
                margin: 0 auto 24px;
            }

            #footer {
                font-size: 11px;
            }
        }

        /* Fix touch scrolling on mobile */
        .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
        .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas {
            touch-action: unset;
        }

        #map-callouts {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 520ms ease, visibility 520ms ease;
        }

        body.map-active #map-callouts.is-visible {
            opacity: 1;
            visibility: visible;
        }

        #map-callout-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        #map-callout-line,
        .map-callout-line {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .map-callout {
            position: absolute;
            width: min(280px, calc(100vw - 48px));
            padding: 12px 14px 10px;
            border: 1px solid rgba(160, 160, 160, 0.45);
            background: rgba(220, 220, 220, 0.8);
            box-shadow: none;
            backdrop-filter: none;
        }

        .map-callout-text {
            margin: 0;
            color: #111;
            font-size: 14px;
            line-height: 1.45;
            font-weight: 400;
        }

        .map-callout-text a {
            color: #111;
            pointer-events: auto;
        }

        .map-callout-image {
            display: block;
            width: 100%;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .map-callout-caption {
            margin: 6px 0 0;
            color: rgba(0, 0, 0, 0.68);
            font-size: 11px;
            line-height: 1.35;
        }

        .map-callout-caption a {
            color: rgba(0, 0, 0, 0.82);
            pointer-events: auto;
        }

        @media (max-width: 900px) {
            .map-callout {
                width: min(220px, calc(100vw - 32px));
            }

            .map-callout-text {
                font-size: 13px;
            }
        }
    </style>
</head>

<body class="start-active">

    <div id="start-splash" aria-hidden="false">
        <img src="./assets/Titelgrafik.png" alt="Re:Name THIS!" />
    </div>
    <div id="scroll-cue" aria-hidden="false">
        <span id="scroll-cue-arrow" aria-hidden="true">↓</span>
        <span>scroll</span>
    </div>
    <div id="chrome">
        <nav id="map-zoom-controls" aria-label="Kartenzoom">
            <button type="button" id="map-zoom-in" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
            <button type="button" id="map-zoom-out" title="Herauszoomen" aria-label="Herauszoomen">−</button>
        </nav>
    </div>
    <div id="map-shell">
        <div id="map"></div>

            'Wolfgang', 'Adenauer', 'Bebel', 'Behring', 'Bismarck', 'Böckler', 'Brandt', 'Brecht', 'Curie',
